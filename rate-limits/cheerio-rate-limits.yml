method: searched
source: https://cheerio.js.org/docs/intro
limit_count: 0
note: >-
  Cheerio documents no rate limits, and cannot have any: it is an in-process library, so
  there is no server, no quota, no key to throttle and no response headers to signal with.
  This replaces a 2026-05-04 bulk-sweep scaffold that invented per-minute and per-month
  quotas across Free / Professional / Enterprise tiers plus X-RateLimit-* response headers
  for a library that returns no HTTP responses — see roadmap#35. The only throughput
  constraint that genuinely exists is local: parser choice and document size. Cheerio's own
  docs note htmlparser2 is faster and uses less memory than parse5, which is the real
  performance lever for a caller processing at volume.
headers: {}
responseCodes: {}
limits: []
policies:
  - name: Not applicable
    description: >-
      No server-side rate limiting exists. Consumers that fetch pages with cheerio's
      fromURL helper are subject to whatever limits the ORIGIN they are scraping enforces,
      not to any limit cheerio imposes.
