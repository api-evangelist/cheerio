note: >-
  Cheerio is distributed as an npm library, not as a hosted API. The packages below
  ARE the product surface. Versions and publish dates were read from the npm registry
  metadata endpoint (registry.npmjs.org/<pkg>) on 2026-09-05. Only packages published
  under the cheeriojs GitHub organization are marked official; css-select, htmlparser2,
  domhandler and domutils are runtime dependencies maintained by the same lead
  maintainer (fb55) in his own org and are recorded as official: false.
