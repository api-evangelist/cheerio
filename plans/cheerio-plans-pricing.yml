note: >-
  Cheerio publishes no plans and no pricing, and correctly so: it is an MIT-licensed
  Node.js library distributed through npm, not a hosted service. There is nothing to
  meter, no account, no key and no tier. This replaces a 2026-05-04 bulk-sweep scaffold
  that invented Free / Professional / Enterprise tiers with request quotas and rate
  limits for a library that answers no requests — see roadmap#35. An honest zero is the
  measurement; the scaffold was not.
pricing_model: free / open source (MIT)
