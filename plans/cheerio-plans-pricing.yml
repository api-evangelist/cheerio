  model: sponsorship
  urls:
    - https://github.com/sponsors/cheeriojs
    - https://cheerio.js.org/sponsors/
  note: >-
    The project accepts GitHub Sponsors funding and lists sponsors on its site. Cheerio
    is also covered by a Tidelift security contact for enterprise subscribers; that is a
    Tidelift subscription, not a cheerio plan.
