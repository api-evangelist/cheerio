description: FinOps framework definition for Cheerio. Cheerio is a free, MIT-licensed, self-hosted
  library with no vendor billing relationship, so this file records a zero-cost provider position and
  the consumer-side costs that do exist — the compute the parser consumes in the consumer's own
  infrastructure. FOCUS columns are populated to that effect rather than to an invented invoice.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Free
  billed: false
  billingFrequency: none
  billingCurrency: none
  chargeCategories: []
  chargeFrequency: none
  license: MIT
  note: >-
    No vendor charge exists. Optional voluntary funding runs through GitHub Sponsors
    (https://github.com/sponsors/cheeriojs) and, for enterprises, a Tidelift subscription —
    neither is metered against usage of the library.
focusColumns:
  ServiceName: Cheerio
  ServiceCategory: Developer Tools / Library
  ProviderName: Cheerio
  PublisherName: Cheerio
  InvoiceIssuerName: null
  PricingCategory: Free
  PricingUnit: null
  BillingCurrency: null
  ChargeCategory: null
meters: []
consumerSideCost:
  billedByProvider: false
  note: >-
    Nothing here is invoiced by Cheerio. These are the consumer's own costs, incurred in
    the consumer's own runtime, and are the only cost dimensions Cheerio adoption has.
  dimensions:
    - name: parse_compute
      description: >-
        CPU and memory consumed parsing documents in the consumer's process. The project's
        own docs name the lever: htmlparser2 is faster and produces a lower-memory DOM than
        the default parse5, and the cheerio/slim export drops parse5 from the bundle
        entirely. — https://cheerio.js.org/docs/advanced/configuring-cheerio/
    - name: bundle_size
      description: Shipped bytes in browser builds; reduced by importing cheerio/slim.
    - name: origin_egress
      description: >-
        Bandwidth and any rate-limit or licensing cost imposed by the ORIGIN sites a
        consumer fetches with fromURL. Owed to those origins, not to Cheerio.
apis:
  - name: Cheerio
    baseURL: ''
    tags:
      - Data Extraction
      - HTML Parsing
      - jQuery
      - Node.js
      - Scraping
    serviceName: Cheerio
    serviceCategory: API
unitEconomics:
  - name: Vendor cost per document parsed
    metric: '0 — no vendor charge exists'
    target: '0'
  - name: Consumer compute cost per 1K documents parsed
    metric: consumer_compute_cost / (documents_parsed / 1000)
    target: consumer-defined; measured in the consumer's own runtime, not billed by Cheerio
