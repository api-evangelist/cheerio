generated: '2026-09-05'
source: >-
  https://github.com/cheeriojs/cheerio/blob/main/LICENSE;
  https://www.npmjs.com/package/cheerio; https://cheerio.js.org/sponsors/
correction: >-
  Corrected 2026-09-05 by the enrichment pipeline. The 2026-05-04 bulk sweep recorded a
  Usage-Based USD billing model with api_requests, data_egress and compute_seconds meters
  for Cheerio. None of that exists: Cheerio is an MIT-licensed npm library that the
  consumer runs in their own process, so there is no invoice, no metered unit and no
  provider-side cost at all. The real cost of adopting Cheerio is the consumer's own
  compute and engineering time, which is what this file now records.
